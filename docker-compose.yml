version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: tp_api_person
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

  app:
    image: openjdk:21-bookworm
    container_name: springboot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tp_api_person
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    volumes:
      - ./target/TP-API-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ./wait-for-db.sh:/app/wait-for-db.sh
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "apt-get update && apt-get install -y netcat-openbsd && chmod +x /app/wait-for-db.sh && /app/wait-for-db.sh db 3306 -- java -jar app.jar"]
    depends_on:
      - db

volumes:
  mysql_data: